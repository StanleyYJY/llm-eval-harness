[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "A small, offline-first evaluation harness for LLM features: structured-output scoring, paired comparison with confidence intervals, judge-human agreement, position-swap checks, and a release gate."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.13", "pandas>=2.2", "tabulate>=0.9"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
